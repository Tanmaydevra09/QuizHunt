apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - '/etc/prometheus/alert-rules.yaml'
    scrape_configs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'quizhunt-app'
        static_configs:
          - targets: ['quizhunt-service:80']
  alert-rules.yaml: |
    groups:
    - name: quizhunt-alerts
      rules:
      - alert: HighCPUUsage
        expr: process_cpu_seconds_total > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"

      - alert: AppDown
        expr: up{job="quizhunt-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "QuizHunt app is down"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m])) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
