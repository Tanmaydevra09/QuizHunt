<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <title>All Quizzes - QuizHunt</title>

  <!-- External libraries -->
  <link rel="stylesheet" href="../styles/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"/>
  
  <!-- Custom Modern Styles -->
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand mx-4" href="../index.html">
        <span class="brand-q">Q</span>uizHunt
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" style="border: 1px solid rgba(255,255,255,0.2);">
        <i class="fa-solid fa-bars" style="color: white"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-4 ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#">Quizzes</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <section id="categories" style="padding-top: 2rem; padding-bottom: 5rem;">
    <div class="section-header">
      <h2>All Quizzes</h2>
      <p>Select a category to start your learning journey.</p>
    </div>
    
    <!-- Dynamically rendered by quiz-metadata.js -->
    <div class="quiz-grid" id="all-quizzes">
      <!-- Cards go here -->
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <div class="footer-brand">
        <span class="brand-q">Q</span>uizHunt
      </div>
      <hr style="width: 100px; border-color: rgba(255,255,255,0.1); margin: 0;"/>
      <p class="footer-text">© 2026 QuizHunt. Designed for developers by developers.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../scripts/jquery-3.2.1.js"></script>
  <script src="../scripts/bootstrap.js"></script>
  <script src="../scripts/quiz-metadata.js?v=2"></script>
  <script>
    // Load all quizzes for playquiz page
    document.addEventListener("DOMContentLoaded", () => {
       renderQuizCards("all-quizzes");
    });
  </script>
</body>
</html>
