apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizhunt-deployment
  labels:
    app: quizhunt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quizhunt
  template:
    metadata:
      labels:
        app: quizhunt
    spec:
      containers:
      - name: quizhunt
        image: tanmaydevra09/quizhunt-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: quizhunt-service
spec:
  type: NodePort
  selector:
    app: quizhunt
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007
